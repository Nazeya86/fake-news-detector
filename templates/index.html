<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fake News Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="text-center mb-4">
            <h1 class="display-5 fw-bold">📰 Fake News Detector</h1>
            <p class="lead text-muted">Enter any news article below to check whether it's real or fake using our ML model.</p>
        </div>

        <div class="card shadow rounded p-4">
            <form action="/predict" method="POST">
                <div class="mb-3">
                    <label for="news" class="form-label fw-semibold">Enter News Content:</label>
                    <textarea name="news" id="news" class="form-control" rows="6" placeholder="Paste the news article here..." required></textarea>
                </div>

                <div class="mb-3 text-center">
                    <button type="button" class="btn btn-outline-success me-2" onclick="fillSample('real')">Try Real News</button>
                    <button type="button" class="btn btn-outline-danger" onclick="fillSample('fake')">Try Fake News</button>
                </div>

                <p class="text-center text-muted" style="font-size: 0.9rem;">Or try with sample real/fake news articles</p>

                <div class="text-center">
                    <button type="submit" class="btn btn-custom px-5">Check</button>
                </div>
            </form>
        </div>

        {% if prediction %}
            <div class="alert alert-info mt-4 text-center">
                <strong>Prediction:</strong> {{ prediction }}
            </div>
        {% endif %}
    </div>

    <script>
        function fillSample(type) {
            const textarea = document.getElementById('news');
            if (type === 'real') {
                textarea.value = "Prime Minister Narendra Modi today addressed the nation, highlighting India's economic growth and development milestones in the past year.";
            } else if (type === 'fake') {
                textarea.value = "Scientists at NASA confirmed that the Earth will go completely dark for six days in November due to a solar storm.";
            }
        }
    </script>

</body>
</html>
